name: PR136454 documentation proof
on:
  push:
    branches: [codex/pr136454-revision-20261013-ci]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
concurrency:
  group: pr136454-revision-proof-docs
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5433bf705921fd5e1bf8384a482eebc8b753e88a
          fetch-depth: 2
          persist-credentials: false
      - name: Install canonical checksum-pinned ripgrep
        uses: ./.github/actions/setup-ripgrep
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Verify exact candidate and isolated inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5433bf705921fd5e1bf8384a482eebc8b753e88a
          test "$(git rev-parse HEAD^)" = fb498cc57a46a1624c7afb910557fd4f02308945
          test ! -f "$HOME/.openclaw/openclaw.json"
          test ! -f "$HOME/.codex/auth.json"
          git diff --check HEAD^ HEAD
          rg --version
      - name: Install pinned workspace dependencies
        id: dependencies
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.9.0 --activate
          /usr/bin/time -p pnpm install --frozen-lockfile
      - name: Changed documentation MDX proof
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format=%H
          /usr/bin/time -p node scripts/check-docs-mdx.mjs docs/concepts/agent-loop.md docs/plugins/hooks/prompt-and-session.md docs/plugins/hooks/reference.md
      - name: Canonical internal documentation links
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: /usr/bin/time -p pnpm docs:check-links
